[tools]
ruby = "3.2.2"

[tasks.start]
description = "Serve the site at http://localhost:4000 with live reload"
run = [
  "command -v magick >/dev/null || echo 'warning: ImageMagick not found (brew install imagemagick)'",
  "bundle check >/dev/null || bundle install",
  "bundle exec jekyll serve --livereload",
]

[tasks."start:docker"]
description = "Serve the site in Docker at http://localhost:8080 (no local Ruby needed)"
run = "docker compose up"

[tasks.upstream]
description = "Merge the latest al-folio release into the current branch, then audit local overrides"
run = [
  "git fetch upstream --tags",
  "git merge --no-edit $(git describe --tags --abbrev=0 upstream/main)",
  "bundle install",
  "bundle exec al-folio upgrade audit --no-fail",
  "bundle exec al-folio upgrade overrides audit",
]

[tasks.pubs]
description = "Add new publications from DBLP to papers.bib (optionally from a downloaded .bib file)"
run = "python3 -I bin/update_pubs.py"

[tasks.build]
description = "Build the site into _site/"
run = [
  "bundle check >/dev/null || bundle install",
  "bundle exec jekyll build",
]
